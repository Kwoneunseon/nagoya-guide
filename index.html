<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8B263E">
  <title>나고야 스토리 가이드북</title>
  <meta name="description" content="과거와 미래의 이야기를 따라가는 나고야 3박 4일. 성과 설산, 온천과 된장 맛 속에 숨은 비화.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kwoneunseon.github.io/nagoya-guide/">
  <meta property="og:title" content="나고야 스토리 가이드북">
  <meta property="og:description" content="과거와 미래의 이야기를 따라가는 나고야 3박 4일. 성과 설산, 온천과 된장 맛 속에 숨은 비화.">
  <meta property="og:image" content="https://kwoneunseon.github.io/nagoya-guide/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="628">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="lead" id="hero-lead"></p>
      <div class="meta" id="hero-places"></div>
    </div>
  </header>

  <div class="wrap">
    <div class="themes" id="theme-cards"></div>

    <section class="sec">
      <h2>여행 지도</h2>
      <p class="sub">핀을 누르면 그날 일정의 스폿으로 이동해요.</p>
      <div class="map">
        <svg viewBox="0 0 520 380" role="group" aria-label="나고야, 게로, 시라카와고 위치 지도">
          <path class="land" d="M70 40 C150 18 260 22 330 48 C400 74 460 120 470 190 C478 250 440 300 380 330 C320 358 230 360 170 340 C110 318 60 270 48 200 C38 140 30 70 70 40 Z"/>
          <path class="route" d="M120 70 C170 120 220 150 270 175 C320 200 330 250 300 300"/>
          <path class="route" d="M300 300 C280 320 260 330 240 300"/>
          <text class="region" x="380" y="82">기후현</text>
          <text class="region" x="380" y="250">아이치현</text>
          <g id="map-pins"></g>
        </svg>
      </div>
    </section>
  </div>

  <nav class="tabs" id="tabs" aria-label="일정">
    <div class="wrap" role="tablist" id="tab-list"></div>
  </nav>

  <main class="wrap" id="panel"></main>

  <footer class="wrap" id="footer"></footer>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grab"></div>
    <button class="close" id="sheet-close" aria-label="닫기">×</button>
    <h4 id="sheet-title"></h4>
    <p class="jp" id="sheet-jp"></p>
    <p id="sheet-desc"></p>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
